<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
        }
        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }
        input {
            width: 90%;
            padding: 8px;
            margin: 5px;
        }
        button {
            padding: 10px;
            margin: 5px;
            border: none;
            background: blue;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: darkblue;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            background: #eee;
            margin: 5px;
            padding: 8px;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Student Management</h2>

    <input type="text" id="name" placeholder="Name"><br>
    <input type="text" id="roll" placeholder="Roll No"><br>
    <input type="text" id="course" placeholder="Course"><br>

    <button onclick="addStudent()">Add</button>
    <button onclick="updateStudent()">Update</button>

    <ul id="list"></ul>
</div>

<script>
let students = [];
let selectedIndex = -1;

// ADD
function addStudent() {
    let name = document.getElementById("name").value;
    let roll = document.getElementById("roll").value;
    let course = document.getElementById("course").value;

    if (name === "" || roll === "" || course === "") {
        alert("Fill all fields");
        return;
    }

    students.push({name, roll, course});
    displayStudents();
    clearFields();
}

// DISPLAY
function displayStudents() {
    let list = document.getElementById("list");
    list.innerHTML = "";

    students.forEach((s, index) => {
        let li = document.createElement("li");
        li.innerHTML = `${s.name} - ${s.roll} - ${s.course}
            <button onclick="deleteStudent(${index})">Delete</button>`;

        // SELECT for update
        li.onclick = () => selectStudent(index);

        list.appendChild(li);
    });
}

// SELECT
function selectStudent(index) {
    selectedIndex = index;
    let s = students[index];

    document.getElementById("name").value = s.name;
    document.getElementById("roll").value = s.roll;
    document.getElementById("course").value = s.course;
}

// UPDATE
function updateStudent() {
    if (selectedIndex === -1) {
        alert("Select a student first!");
        return;
    }

    students[selectedIndex] = {
        name: document.getElementById("name").value,
        roll: document.getElementById("roll").value,
        course: document.getElementById("course").value
    };

    displayStudents();
    clearFields();
    selectedIndex = -1;
}

// DELETE
function deleteStudent(index) {
    students.splice(index, 1);
    displayStudents();
}

// CLEAR
function clearFields() {
    document.getElementById("name").value = "";
    document.getElementById("roll").value = "";
    document.getElementById("course").value = "";
}
</script>

</body>
</html>
